build:
  name: Bunny Talks iOS HTTPS qualification
  steps:
    - eas/checkout
    - run:
        name: Check the dedicated simulator app configuration
        command: |
          node -e 'const a = require("./app.json").expo; const p = require("./package.json"); if (process.env.EAS_BUILD_PLATFORM !== "ios" || process.env.BUNNY_IOS_HTTPS_QUALIFICATION !== "1" || p.main !== "qualification/native-https-entry.tsx" || a.ios.bundleIdentifier !== "fr.bunnytalks.mobile.httpsqualification") process.exit(1)'
    - eas/build
    - run:
        name: Record the simulator build result
        command: echo BUNNY_IOS_BUILD_SUCCEEDED
    - eas/start_ios_simulator
    - run:
        name: Run the isolated HTTPS fixture and simulator
        command: bash qualification/run-ios-eas.sh
    - eas/upload_artifact:
        name: Upload sanitized qualification evidence
        if: ${ always() }
        inputs:
          type: build-artifact
          # Artifact paths are relative to the extracted workspace, not the app directory.
          path: |
            apps/mobile/qualification/ios-results/environment.txt
            apps/mobile/qualification/ios-results/app-results.txt
            apps/mobile/qualification/ios-results/server-events.json
            apps/mobile/qualification/ios-results/server-result.txt

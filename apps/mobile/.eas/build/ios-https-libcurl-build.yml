build:
  name: Bunny Talks iOS libcurl link evidence
  steps:
    - eas/checkout
    - run:
        name: Verify the isolated build inputs
        command: |
          node -e 'const a = require("./app.json").expo; const p = require("./package.json"); if (process.env.EAS_BUILD_PLATFORM !== "ios" || process.env.BUNNY_IOS_HTTPS_QUALIFICATION !== "1" || p.main !== "qualification/ios-libcurl-build-entry.tsx" || a.ios.bundleIdentifier !== "fr.bunnytalks.mobile.httpsqualification") process.exit(1)'
          mkdir -p qualification/ios-link-evidence
          native=modules/application-https/ios
          python3 "$native/verify_xcframeworks.py" archive "$native/vendor/xcframeworks.zip" > qualification/ios-link-evidence/provenance.json
    - eas/build
    - run:
        name: Inspect the linked simulator executable
        command: bash qualification/inspect-ios-libcurl-build.sh
    - eas/upload_artifact:
        name: Upload iOS link evidence
        if: ${ always() }
        inputs:
          type: build-artifact
          path: |
            apps/mobile/qualification/ios-link-evidence/provenance.json
            apps/mobile/qualification/ios-link-evidence/link.json

name: Bunny Talks iOS standard HTTPS laboratory Release

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full SHA explicitly approved for this laboratory campaign
        required: true
        type: string
      reviewed_tree_sha256:
        description: Independently reviewed SHA-256 inventory of the GitHub SHA tarball export
        required: true
        type: string
      hosted_observed:
        description: Approve the hosted-observed laboratory profile
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-standard-https-lab
  cancel-in-progress: false

jobs:
  laboratory:
    if: github.repository == 'ntapiaDev/bunny-talks' && github.run_attempt == '1'
    runs-on: macos-26
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      EXPO_NO_DOTENV: '1'
      EXPO_OFFLINE: '1'
    steps:
      - name: Gate the reviewed revision and inventory
        id: approval
        env:
          HOSTED_OBSERVED: ${{ inputs.hosted_observed }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          REVIEWED_TREE_SHA256: ${{ inputs.reviewed_tree_sha256 }}
        run: |
          [[ "$HOSTED_OBSERVED" == true ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ && "$REVIEWED_SHA" == "$GITHUB_SHA" ]]
          [[ "$REVIEWED_TREE_SHA256" =~ ^[a-f0-9]{64}$ ]]

      - name: Check out the reviewed revision
        id: checkout
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          set-safe-directory: false

      - name: Select Node 24 arm64
        id: node
        timeout-minutes: 4
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          architecture: arm64
          package-manager-cache: false

      - name: Build and exercise the laboratory Release
        id: campaign
        if: steps.approval.outcome == 'success' && steps.checkout.outputs.commit == github.sha && steps.node.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          HOSTED_OBSERVED: ${{ inputs.hosted_observed }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          REVIEWED_TREE_SHA256: ${{ inputs.reviewed_tree_sha256 }}
          CHECKED_OUT_SHA: ${{ steps.checkout.outputs.commit }}
        run: |
          exec python3 -IB apps/mobile/scripts/run-ios-standard-https-lab.py \
            "$RUNNER_TEMP/bunny-ios-https-lab-proof/report.json"

      - name: Preserve a sanitized report when the worker never starts
        if: always()
        env:
          APPROVAL: ${{ steps.approval.outcome }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          CHECKOUT_MATCH: ${{ steps.checkout.outputs.commit == github.sha }}
          NODE: ${{ steps.node.outcome }}
          CAMPAIGN: ${{ steps.campaign.outcome }}
        run: |
          umask 077
          proof="$RUNNER_TEMP/bunny-ios-https-lab-proof"
          mkdir -p "$proof"
          [[ ! -s "$proof/report.json" ]] || exit 0
          python3 -I - "$proof/report.json" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          revision, run = (os.environ.get(name, "") for name in ("GITHUB_SHA", "GITHUB_RUN_ID"))
          failed = any(os.environ.get(name) == "failure" for name in ("APPROVAL", "CHECKOUT", "NODE", "CAMPAIGN"))
          failed |= os.environ.get("CHECKOUT") == "success" and os.environ.get("CHECKOUT_MATCH") != "true"
          Path(sys.argv[1]).write_text(json.dumps({
              "schemaVersion": 1,
              "scope": "ios-standard-https-laboratory-release",
              "revision": revision if re.fullmatch("[a-f0-9]{40}", revision) else None,
              "run": int(run) if re.fullmatch("[0-9]{1,20}", run) else None,
              "verdict": "FAIL" if failed else "NOT_RUN",
              "complete": False,
              "laboratoryHttpsRuntime": "NOT_RUN",
              "standardHttpsRuntime": "NOT_RUN",
          }, sort_keys=True, indent=2) + "\n")
          PY

      - name: Upload the sanitized laboratory report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-standard-https-lab-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bunny-ios-https-lab-proof/report.json
          if-no-files-found: error
          retention-days: 7

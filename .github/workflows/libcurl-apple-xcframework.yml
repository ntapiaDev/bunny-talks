name: 4.5B2C3-A Apple XCFramework build

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full SHA of the reviewed revision selected for this run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: libcurl-apple-xcframework
  cancel-in-progress: false

jobs:
  xcframeworks:
    if: github.repository == 'ntapiaDev/bunny-talks' && github.run_attempt == '1'
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Validate the reviewed revision and initialize evidence
        id: prepare
        timeout-minutes: 1
        env:
          REVIEWED_REVISION_MATCH: ${{ inputs.reviewed_sha == github.sha }}
        run: |
          umask 077
          root="$RUNNER_TEMP/bunny-xcframework-4.5B2C3-A"
          mkdir "$root" "$root/proof"
          record() {
            printf '{"scope":"xcframework-build-inspection-link","revision":null,"verdict":"NOT_RUN","reason":"%s"}\n' "$1" > "$root/proof/report.json"
          }
          record preparation/reviewed-revision
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$REVIEWED_REVISION_MATCH" == true ]]
          record preparation/workspace
          mkdir "$root/scratch" "$root/delivery"
          record build-not-started

      - name: Check out the reviewed revision
        id: checkout
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          set-safe-directory: false
          sparse-checkout: experiments/libcurl-apple-xcframework

      - name: Select Node 24 arm64
        id: node
        timeout-minutes: 3
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          architecture: arm64
          package-manager-cache: false

      - name: Build and verify both static XCFrameworks
        id: build
        timeout-minutes: 30
        env:
          CHECKED_OUT_SHA: ${{ steps.checkout.outputs.commit }}
        run: node experiments/libcurl-apple-xcframework/run-github-actions.mjs "$RUNNER_TEMP/bunny-xcframework-4.5B2C3-A"

      - name: Remove temporary archives, tool reports and build files
        id: cleanup
        if: always()
        timeout-minutes: 2
        run: |
          root="$RUNNER_TEMP/bunny-xcframework-4.5B2C3-A"
          scratch="$root/scratch"
          state=not-created
          if [[ -L "$root" || -L "$scratch" ]]; then
            state=failed
          elif [[ -e "$scratch" ]]; then
            state=failed
            if [[ -d "$scratch" ]] && rm -rf -- "$scratch" >/dev/null 2>&1 && [[ ! -e "$scratch" ]]; then
              state=removed
            fi
          fi
          printf 'state=%s\n' "$state" >> "$GITHUB_OUTPUT"
          [[ "$state" != failed ]]

      - name: Upload the verified XCFramework package
        id: binaries
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.cleanup.outcome == 'success' && steps.cleanup.outputs.state == 'removed' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-xcframeworks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bunny-xcframework-4.5B2C3-A/delivery/xcframeworks.tar
          if-no-files-found: error
          retention-days: 7

      - name: Finalize evidence and publish the technical summary
        if: always()
        timeout-minutes: 1
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          CHECKED_OUT_SHA: ${{ steps.checkout.outputs.commit }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CLEANUP_STATE: ${{ steps.cleanup.outputs.state }}
          BINARY_OUTCOME: ${{ steps.binaries.outcome }}
          BINARY_ID: ${{ steps.binaries.outputs.artifact-id }}
          BINARY_DIGEST: ${{ steps.binaries.outputs.artifact-digest }}
        run: |
          umask 077
          env -u DEVELOPER_DIR python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          env = os.environ
          path = Path(env["RUNNER_TEMP"]) / "bunny-xcframework-4.5B2C3-A" / "proof" / "report.json"
          path.parent.mkdir(parents=True, exist_ok=True)
          try:
              report = json.loads(path.read_text())
          except (OSError, ValueError):
              report = {
                  "scope": "xcframework-build-inspection-link",
                  "revision": None,
                  "verdict": "NOT_RUN",
                  "reason": "build-not-started",
              }

          dispatch = env["GITHUB_SHA"]
          if re.fullmatch(r"[0-9a-f]{40}", dispatch):
              report["dispatchRevision"] = dispatch
              if env["CHECKOUT_OUTCOME"] == "success" and dispatch == env["CHECKED_OUT_SHA"]:
                  report["revision"] = dispatch
          if report["reason"] == "build-not-started":
              for name, reason in (
                  ("PREPARE_OUTCOME", "preparation/workspace"),
                  ("CHECKOUT_OUTCOME", "preparation/checkout"),
                  ("NODE_OUTCOME", "preparation/node-setup"),
              ):
                  if env[name] != "success":
                      report["reason"] = reason
                      break
              else:
                  report["reason"] = "preparation/recipe-entrypoint"

          cleanup = env["CLEANUP_STATE"]
          report["cleanup"] = cleanup if cleanup in ("removed", "not-created", "failed") else "unconfirmed"
          outcome = env["BINARY_OUTCOME"]
          binary_id = env["BINARY_ID"]
          digest = re.fullmatch(r"(?:sha256:)?([0-9a-f]{64})", env["BINARY_DIGEST"])
          published = outcome == "success" and digest and re.fullmatch(r"[0-9]+", binary_id)
          if published:
              report["publication"] = {"state": "uploaded", "id": binary_id, "sha256": digest[1]}
          else:
              state = {
                  "failure": "failed",
                  "cancelled": "cancelled",
                  "success": "unconfirmed",
              }.get(outcome, "skipped")
              report["publication"] = {"state": state}

          pending = path.with_suffix(".finalizing")
          pending.write_text(json.dumps(report, indent=2) + "\n")
          pending.replace(path)
          with open(env["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("# Construction Apple 4.5B2C3-A\n\n")
              summary.write(f"- Construction et inspection — `{report['verdict']}` / `{report['reason']}`\n")
              summary.write(f"- Révision du checkout — `{report['revision'] or 'indisponible'}`\n")
              summary.write(f"- Nettoyage — `{report['cleanup']}`\n")
              summary.write(f"- Publication du paquet — `{report['publication']['state']}`\n")
              summary.write("\nPérimètre du résultat — construction, packaging et liaison des sondes. "
                            "Exécution iOS, TLS et émission HTTP hors de cet essai.\n")

          if env["BUILD_OUTCOME"] == "success" and (
              report["verdict"] != "PASS" or report["cleanup"] != "removed" or not published
          ):
              raise SystemExit(1)
          PY

      - name: Upload sanitized evidence
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-xcframework-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bunny-xcframework-4.5B2C3-A/proof/report.json
            ${{ runner.temp }}/bunny-xcframework-4.5B2C3-A/proof/manifest.json
          if-no-files-found: error
          retention-days: 7

services:
  postgres:
    image: postgres:18.7
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      BUNNY_DEV_PASSWORD: ${BUNNY_DEV_PASSWORD:?BUNNY_DEV_PASSWORD is required}
      BUNNY_TEST_PASSWORD: ${BUNNY_TEST_PASSWORD:?BUNNY_TEST_PASSWORD is required}
    ports:
      - '127.0.0.1:15432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - bunny_postgres_data:/var/lib/postgresql
      - ./apps/api/prisma/local-init:/docker-entrypoint-initdb.d:ro
volumes:
  bunny_postgres_data:

name: POC libcurl iOS Simulator

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libcurl-ios-simulator
  cancel-in-progress: false

jobs:
  single-emission:
    if: github.repository == 'ntapiaDev/bunny-talks'
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Initialize evidence and temporary directory
        run: |
          umask 077
          proof="$RUNNER_TEMP/bunny-libcurl-proof"
          mkdir "$proof"
          printf '%s\n' '{"verdict":"NOT_RUN","reason":"ci-preparation-incomplete"}' > "$proof/report.json"
          printf '# POC libcurl sur iOS Simulator\n\n' > "$proof/summary.md"
          printf '%s\n\n' 'Le verdict porte exclusivement sur le scénario d’émission unique du harnais natif autonome libcurl sur simulateur Apple.' >> "$proof/summary.md"
          scratch="$(mktemp -d /tmp/bunny-libcurl-ci.XXXXXXXX)"
          printf 'BUNNY_LIBCURL_TMPDIR=%s\n' "$scratch" >> "$GITHUB_ENV"

      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /experiments/libcurl-single-emission/
            /apps/mobile/qualification/server.ts
            /apps/mobile/qualification/standard-json-scenarios.ts
            /apps/mobile/qualification/certificates.sh
            /apps/mobile/package.json
            /package.json

      - name: Verify environment, build and run the POC
        timeout-minutes: 24
        run: bash experiments/libcurl-single-emission/run-github-actions.sh

      - name: Remove the experiment simulator and temporary files
        if: always()
        timeout-minutes: 2
        run: |
          proof="$RUNNER_TEMP/bunny-libcurl-proof"
          scratch="${BUNNY_LIBCURL_TMPDIR:-}"
          status=0
          if [[ "$scratch" =~ ^/tmp/bunny-libcurl-ci\.[[:alnum:]]{8}$ && -d "$scratch" ]]; then
            if [[ -s "$scratch/simulator-udid" ]]; then
              udid="$(cat "$scratch/simulator-udid")"
              if [[ "$udid" =~ ^[[:xdigit:]]{8}(-[[:xdigit:]]{4}){3}-[[:xdigit:]]{12}$ ]]; then
                xcrun simctl shutdown "$udid" >/dev/null 2>&1 || true
                xcrun simctl delete "$udid" >/dev/null 2>&1 || status=1
              else
                status=1
              fi
            fi
            rm -rf -- "$scratch" || status=1
          elif [[ -n "$scratch" ]]; then
            status=1
          fi
          if [[ "$status" == 0 ]]; then
            printf -- '- Nettoyage des ressources du POC terminé.\n' >> "$proof/summary.md"
          else
            printf -- '- Nettoyage incomplet sur le runner jetable.\n' >> "$proof/summary.md"
          fi
          exit "$status"

      - name: Publish the technical summary
        if: always()
        run: |
          proof="$RUNNER_TEMP/bunny-libcurl-proof"
          cat "$proof/summary.md" >> "$GITHUB_STEP_SUMMARY"
          printf '\n`report.json` contient le verdict et le motif.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libcurl-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bunny-libcurl-proof/build.json
            ${{ runner.temp }}/bunny-libcurl-proof/report.json
            ${{ runner.temp }}/bunny-libcurl-proof/summary.md
          if-no-files-found: error
          retention-days: 7

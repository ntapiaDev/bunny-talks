build:
  name: Bunny Talks iOS libcurl runtime qualification
  steps:
    - eas/checkout
    - run:
        name: Check isolated runtime build inputs
        command: node qualification/run-ios-libcurl-runtime.mjs --preflight
    - eas/build
    - run:
        name: Capture link evidence for this executable
        command: python3 -I qualification/inspect-ios-libcurl-runtime.py
    - run:
        name: Qualify the embedded runtime on a disposable simulator
        command: node qualification/run-ios-libcurl-runtime.mjs
    - eas/upload_artifact:
        name: Upload sanitized libcurl qualification evidence
        if: ${ always() }
        inputs:
          type: build-artifact
          path: |
            apps/mobile/qualification/ios-libcurl-results/provenance.json
            apps/mobile/qualification/ios-libcurl-results/link.json
            apps/mobile/qualification/ios-libcurl-results/environment.json
            apps/mobile/qualification/ios-libcurl-results/installed.json
            apps/mobile/qualification/ios-libcurl-results/runtime.json
            apps/mobile/qualification/ios-libcurl-results/witness.json
            apps/mobile/qualification/ios-libcurl-results/summary.json
